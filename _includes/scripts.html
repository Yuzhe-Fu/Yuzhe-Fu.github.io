<script src="assets/js/main.min.js"></script>
<script>
  (function () {
    var box = document.querySelector(".news-fold");
    var button = document.querySelector(".news-toggle");
    if (!box || !button) return;

    if (box.querySelectorAll("li").length <= 10) return;

    button.hidden = false;
    button.addEventListener("click", function () {
      var open = box.classList.toggle("is-open");
      button.textContent = open ? "Show less" : "Read more";
      button.setAttribute("aria-expanded", open ? "true" : "false");
      if (!open) {
        var heading = document.getElementById("-news");
        if (heading && heading.scrollIntoView) {
          heading.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }
    });
  })();
</script>
